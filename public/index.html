<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ginmi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='4' y='4' width='92' height='92' rx='22' fill='%23e5484d'/%3E%3Ctext x='50' y='73' font-size='66' fill='%23fff' font-family='Hiragino Mincho ProN%2C Yu Mincho%2C serif' font-weight='bold' text-anchor='middle'%3E%E5%90%9F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/vendor/markdown-it.js"></script>
  <script src="/vendor/mermaid.js"></script>
  <script src="/vendor/svg-pan-zoom.js"></script>
</head>
<body>
  <header id="topbar">
    <span class="brand">吟味 ginmi</span>
    <a id="mr-link" target="_blank" rel="noopener"></a>
    <span id="progress"></span>
    <span id="base-status"></span>
    <span id="paths"></span>
    <button id="copy-handoff" type="button" title="Copy a line to paste into any agent session">Copy feedback handoff</button>
    <button id="ask-general" type="button">Ask about the whole review</button>
  </header>
  <div id="layout">
    <main id="review"></main>
  </div>
  <div id="margin-pop" hidden>
    <div class="pop-head"><span class="hint">Thread</span><button id="pop-close" type="button" title="Close (Esc)">×</button></div>
    <div class="pop-cards"></div>
    <div class="pop-foot" hidden>
      <div id="pop-replying" class="hint"></div>
      <div class="follow"><textarea id="pop-input" rows="2"></textarea><button id="pop-send" type="button">Send</button></div>
    </div>
    <div class="pop-resize left" title="Drag to resize; double-click to reset"></div>
    <div class="pop-resize right" title="Drag to resize; double-click to reset"></div>
  </div>
  <button id="ask-button" type="button" hidden>Ask</button>
  <form id="ask-form" hidden>
    <div id="ask-anchor"></div>
    <textarea id="ask-text" rows="3" placeholder="What would you like clarified? (⌘↵ to send)"></textarea>
    <div class="row">
      <button type="submit">Ask</button>
      <button type="button" id="ask-cancel">Cancel</button>
    </div>
  </form>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
